; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Uploading:
;   First flash (USB serial): pio run -e usb-esp32 -t upload
;   Later updates (OTA):      pio run -e ota-esp32 -t upload

[platformio]
default_envs = usb-esp32

; Settings shared by the usb and ota environments
[env]
platform = espressif32
board = esp32dev
framework = arduino
build_flags = -Wall
monitor_speed = 115200
lib_deps =
  knolleary/PubSubClient@^2.8
  pfeerick/elapsedMillis@^1.0.6
  bblanchon/ArduinoJson@^7.4.3

; USB serial upload (esptool is the default upload protocol)
[env:usb-esp32]
#upload_port = COM5

; Over-the-air upload. Use the controller's IP address instead of
; ctrl4dkn.local if mDNS is not available in your network.
[env:ota-esp32]
upload_protocol = espota
upload_port = ctrl4dkn.local
